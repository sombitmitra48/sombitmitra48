<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="title">
  <title id="title">Thanks for visiting my profile</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="98" rx="18" fill="#0D1117" stroke="#29334D"/>
  <path d="M80 26 H1120" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="7s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="60" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">Thanks for stopping by <tspan fill="#67E8F9">✦</tspan> Keep building.</text>
  <text x="600" y="82" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" letter-spacing="2">LEARN · BUILD · ITERATE</text>
</svg>
