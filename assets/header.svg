<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Sombit Mitra — AI/ML Developer</title>
  <desc id="desc">Animated midnight-neon banner with cyan and violet gradients, orbiting particles, and a terminal-inspired grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B17"/>
      <stop offset="55%" stop-color="#10152B"/>
      <stop offset="100%" stop-color="#17102D"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6366F1" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#8B9BC4" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <ellipse cx="180" cy="40" rx="300" ry="220" fill="url(#glow)">
    <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1040" cy="300" rx="320" ry="230" fill="url(#glow)">
    <animate attributeName="cy" values="300;210;300" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="url(#neon)" stroke-opacity=".45">
    <path d="M-20 250 C220 180 260 350 500 255 S850 150 1220 230" stroke-width="1.5">
      <animate attributeName="stroke-dasharray" values="3 12;18 8;3 12" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-10 275 C220 205 310 360 550 275 S920 185 1220 260" stroke-width="1">
      <animate attributeName="stroke-opacity" values=".15;.55;.15" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#67E8F9" filter="url(#softGlow)">
    <circle cx="150" cy="92" r="2.5"><animate attributeName="cy" values="92;78;92" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="85" r="2"><animate attributeName="cy" values="85;105;85" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="245" r="2.5"><animate attributeName="r" values="2.5;4;2.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="245" r="1.8"><animate attributeName="r" values="1.8;3.4;1.8" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="600" y="92" text-anchor="middle" fill="#A5B4FC" font-size="15" letter-spacing="5">HELLO, WORLD — I'M</text>
    <text x="600" y="160" text-anchor="middle" fill="#F8FAFC" font-size="54" font-weight="700" letter-spacing="1">SOMBIT MITRA</text>
    <rect x="345" y="184" width="510" height="2" rx="1" fill="url(#neon)">
      <animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="220" text-anchor="middle" fill="#C4B5FD" font-size="18">CSE · ARTIFICIAL INTELLIGENCE &amp; MACHINE LEARNING</text>
    <text x="600" y="264" text-anchor="middle" fill="#67E8F9" font-size="14">$ building ideas into working software <tspan fill="#C084FC">▌</tspan>
      <animate attributeName="opacity" values="1;.55;1" dur="1.4s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>
</svg>
